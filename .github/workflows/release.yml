name: Release

# Run from the Actions tab (or the API) after the version bump is on main.
# Tags the checked-out commit with manifest.json's version and publishes the
# GitHub Release with the three plugin assets RELEASING.md requires.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check versions
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          node -e "
            const m = require('./manifest.json'), p = require('./package.json'), v = require('./versions.json');
            if (p.version !== m.version) throw new Error('package.json ' + p.version + ' != manifest.json ' + m.version);
            if (v[m.version] !== m.minAppVersion) throw new Error('versions.json has no ' + m.version + ' -> ' + m.minAppVersion + ' entry');
          "
          test -f "docs/releases/$version.md" || { echo "Missing docs/releases/$version.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            test "$(git rev-parse "$VERSION^{commit}")" = "$(git rev-parse HEAD)" || { echo "Tag $VERSION already points at another commit"; exit 1; }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Calendar-Note $VERSION"
            git push origin "refs/tags/$VERSION"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "Release $VERSION already exists"; exit 0; fi
          gh release create "$VERSION" --verify-tag --title "Calendar-Note $VERSION" --notes-file "docs/releases/$VERSION.md" \
            dist/calendar-note/main.js dist/calendar-note/manifest.json dist/calendar-note/styles.css dist/calendar-note.zip
