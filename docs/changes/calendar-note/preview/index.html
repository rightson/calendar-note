<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar-Note — 週行事曆</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="calendar"><div class="app-shell"><aside id="sidebar" class="sidebar"></aside><main class="main"><header class="page-header"><div><div class="eyebrow">你的時間，與想法相連</div><h1 id="month-title">2026 年 10 月</h1><p>讓每個行程，都有筆記的起點。</p></div><span class="prototype-badge"><i></i>互動原型 · 示範資料</span></header><div class="calendar-layout"><section class="calendar-main" aria-label="行事曆"><div class="calendar-toolbar"><div class="date-controls"><button id="today-button" class="button">今天</button><button id="prev-button" class="icon-button" aria-label="上一個期間">‹</button><button id="next-button" class="icon-button" aria-label="下一個期間">›</button><span id="date-range" class="date-range"></span></div><div class="view-controls"><button id="new-event" class="button primary">＋ 新增事件</button><div class="segmented" aria-label="行事曆檢視"><button data-view="week" class="active">週</button><button data-view="month">月</button><button data-view="day">日</button><button data-view="list">清單</button></div><button id="refresh-button" class="icon-button refresh" aria-label="模擬同步行事曆" title="模擬同步">↻</button></div></div><div id="calendar" class="calendar"></div><div class="calendar-footer"><span><span class="tiny-note">↗</span> 點擊空白新增 · 點擊事件開啟筆記 · 拖曳上下緣調整時間</span><span>Asia/Taipei · UTC+8</span></div></section><aside id="note-panel" class="note-panel" aria-label="行程與筆記"></aside></div></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="detail-dialog" class="modal"><div id="detail-content"></div></dialog><script src="vendor/moment-with-locales.min.js"></script><script src="path-format.js"></script><dialog id="event-dialog" class="modal event-modal"><form id="event-form"><div class="modal-header"><div><div class="eyebrow">LOCAL EVENT · 本機示範</div><h2 id="event-dialog-title">新增事件</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="關閉">×</button></div><label class="field-label" for="event-title">事件名稱</label><input id="event-title" class="text-input" required maxlength="120" placeholder="為這段時間取個名字"><div class="event-datetime-fields"><label class="field-label" for="event-start">開始時間<input id="event-start" class="text-input" type="datetime-local" step="900" required></label><label class="field-label" for="event-end">結束時間<input id="event-end" class="text-input" type="datetime-local" step="900" required></label></div><label class="field-label" for="event-source">行事曆</label><select id="event-source" class="text-input"><option value="local">本機事件</option></select><p id="event-dialog-help" class="field-help">不需要 iCal。儲存後會建立事件筆記，並連結到事件當天的 Daily Note。此原型支援單日事件（可到午夜），以 15 分鐘為單位。</p><p id="event-error" class="form-error" role="alert"></p><div class="form-actions"><button type="submit" class="button primary" id="event-submit">建立事件與筆記</button><button type="button" class="button quiet" data-close-dialog>取消</button></div></form></dialog><div id="event-context-menu" class="event-context-menu" role="menu" hidden><p id="context-time"></p><button id="context-create" role="menuitem">＋ 在此時間新增事件</button></div><script src="event-core.js"></script><script src="app.js"></script></body></html>
