<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar-Note — 週行事曆</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="calendar"><div class="app-shell"><aside id="sidebar" class="sidebar"></aside><main class="main"><header class="page-header"><div><div class="eyebrow">你的時間，與想法相連</div><h1 id="month-title">2026 年 10 月</h1><p>讓每個行程，都有筆記的起點。</p></div><span class="prototype-badge"><i></i>互動原型 · 示範資料</span></header><div class="calendar-layout"><section class="calendar-main" aria-label="行事曆"><div class="calendar-toolbar"><div class="date-controls"><button id="today-button" class="button">今天</button><button id="prev-button" class="icon-button" aria-label="上一個期間">‹</button><button id="next-button" class="icon-button" aria-label="下一個期間">›</button><span id="date-range" class="date-range"></span></div><div class="view-controls"><div class="segmented" aria-label="行事曆檢視"><button data-view="week" class="active">週</button><button data-view="month">月</button><button data-view="day">日</button><button data-view="list">清單</button></div><button id="refresh-button" class="icon-button refresh" aria-label="模擬同步行事曆" title="模擬同步">↻</button></div></div><div id="calendar" class="calendar"></div><div class="calendar-footer"><span><span class="tiny-note">↗</span> 點擊行程，開啟它的專屬筆記</span><span>Asia/Taipei · UTC+8</span></div></section><aside id="note-panel" class="note-panel" aria-label="行程與筆記"></aside></div></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="detail-dialog" class="modal"><div id="detail-content"></div></dialog><script src="vendor/moment-with-locales.min.js"></script><script src="path-format.js"></script><script src="app.js"></script></body></html>
